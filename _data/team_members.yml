- name: Amy E. Zanne
  photo: AmyZanne.jpeg
  info: Senior Scientist
  email: aezanne@gmail.com
  number_educ: 4
  education1: Research interests include ecology, evolution and physiology, especially that of plants, termites and microbes, decomposition, carbon cycling
  education2: Favorite species? An impossible question! Probably a Proteaceae - Conospermum ericifolium
  education3: Favorite things to cook? Fermented foods. Dishes that include lemon, mushrooms, rosemary, farro, cumin, zatar, tempeh, arugula, hot sauce, garlic, corn - usually of my own creation.
  education4: Find me at Cary Institute of Ecosystem Studies
  
- name: Baptiste Wijas
  photo: IMG_0568.JPG
  info: Postdoctoral researcher
  email: bwijas@gmail.com
  number_educ: 3
  education1: I am an ecosystem ecologist interested in decay processes of organic matter and the role that animals play in that process. My research focuses more particularly on termites, which some could say rule the carbon cycling dynamics of the tropics! 
  education2: Favorite species? So many, but some cute Australian ones are the Spotted pardalote and the Echidna (even though they eat termites, they're too cute not to like...).
  education3: Favorite thing to cook or bake? Vegan tofu, asparagus and mushroom quiche.

- name: Paulo Bernardino
  photo: RSOQ0748.jpg
  info: Postdoctoral researcher
  email: paulo.nbernardino@gmail.com
  number_educ: 3
  education1: I am interested in understanding abrupt changes in ecosystems, what causes them, and how they can be predicted. To do so, I use remote sensing and advanced time series analyses.
  education2: Favorite species? Philcoxia minensis! (Have you ever seen a plant with underground leaves?!)
  education3: Favorite thing to cook or bake? All sorts of pasta. I would eat pasta every day if I could.

- name: Bruna Hornink
  photo: bruna.jpeg
  info: 2nd Year PhD Student
  email: bhornink@gmail.com
  number_educ: 3
  education1: I am interested in studying how wood traits respond to climate and atmospheric changes over time, specifically within various environmental conditions. Also, my interests extend to tropical forest management and the diverse applications of dendrochronology in multidisciplinary settings.
  education2: Favorite species? Handroanthus impetiginosus
  education3: Favorite thing to cook or bake? Any kind of pasta, with or without sauce.

- name: Larissa Verona
  photo: larissa.jpg
  info: Research Assistant
  email: larissasverona@gmail.com
  number_educ: 3
  education1: I am interested in understanding how ecosystems function and how plants influence these processes. Additionally, I aim to apply this knowledge in applied efforts such as restoration ecology. Recently, I have been focusing on carbon dynamics in wetlands and am passionate about these incredible ecosystems!
  education2: Favorite species? Loudetiopsis chrysothrix. This small grass has amazing golden colors and an inflorescence that looks like an earring. 
  education3: Favorite thing to cook or bake? Brazilian pão de queijo — a small bread filled with lots of cheese.

- name: Guilherme Macedo de Alencar
  photo: guilherme.jpg
  info: Undergraduate student
  email: guimacedoa283@gmail.com
  number_educ: 3
  education1: I am interested in understanding how plant diversity affects ecological processes and how environmental filters shape the distribution of species in wetlands in Brazil.
  education2: Favorite species? Stachytarpheta glazioviana. A small plant with almost white leaves and black flowers.
  education3: Favorite thing to cook or bake? Zucchini lasagna.

- name: Rafael Correia
  photo: rafa_c.jpeg
  info: Technician
  email: rafaa.corr@protonmail.com
  number_educ: 3
  education1: I am a electromechanical technician interested in the behavior of honey bees in Orgone beehive and the influence on their navigation. I also have experience with working with Renewable Energy.
  education2: Favorite species? Honeybee, Native Bees and Black Soldier Larva. In general, social insects.
  education3: Favorite thing to cook or bake? Eggs with cassava flour and bread. Fast and easy to make.

- name: Jade Guimarães
  photo: Jade_profile.jpeg
  info: PhD Student
  email: jade.guimaraes@ufv.br
  number_educ: 3
  education1: I feel a genuine happiness when I’m surrounded by a tropical forest. In my PhD, I study how forests respond to climate change and to the alterations caused by humans, mapping the health of the inner wood of living trees in the Amazon. My main questions are: how do organisms — especially termites and fungi — influence forest resistance and resilience, and how do carbon and methane flow in this process?
  education2: Favorite species? Lobo-guará (Chrysocyon brachyurus) and ariranha (Pteronura brasiliensis)
  education3: Favorite thing to cook or bake? Broa de fubá with orange, guava paste and cinnamon — a traditional Brazilian cornmeal cake, my grandmother Nely’s recipe

- name: Abbey Yatsko
  photo: abbey2.jpg
  info: 5th Year PhD Student
  email: ayatsko1@gmail.com
  number_educ: 3
  education1: I am interested in how carbon cycles within trees of savanna ecosystems. My dissertation research is focused on measuring wood decomposition occuring within trees as well as quantifying methane emissions coming from termite mounds.
  education2: Favorite species? For plants, the quaking aspen (Populus tremuloides), and for animals, I love eastern grey squirrels (Sciurus carolinensis)!
  education3: Favorite thing to cook or bake? Sourdough bread of all forms (stay tuned for my bakery opening...)

- name: Yuri Souza
  photo: yuri.jpg
  info: Masters Student
  email: desouza.s.yuri@gmail.com
  number_educ: 3
  education1: My interests rely broadly on understanding community dynamics and ecosystem ecology. With this lab, I explored the termite species turnover in the Brazillian Savanna along a habitat heterogeneity gradient.  
  education2: Favorite species? Right now it is the Bard Owl. This owl has a funny staring face.
  education3: Favorite thing to cook or bake? Risotto, Pasta, and pizza!
  
